<style>
  :root{
    --bg:#f5f2ec; --card:#fffdf9; --ink:#3b3a36; --sub:#6b665d; --line:#e4ded3;
    --accent:#5f7f74; --accent-soft:#e6eee9; --ok:#4f8a5b; --ok-soft:#e5f1e6; --ng:#b4614e; --ng-soft:#f6e6e1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:1.25rem;margin:0;letter-spacing:.05em}
  header .meta{color:var(--sub);font-size:.85rem;margin-top:4px}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:.8rem;margin-top:8px}
  .card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
  .progress{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .dot.now{background:var(--accent)} .dot.ok{background:var(--ok)} .dot.ng{background:var(--ng)}
  .qnum{color:var(--accent);font-weight:700;font-size:.9rem}
  .qtext{font-size:1.05rem;font-weight:700;margin:6px 0 16px;white-space:pre-wrap}
  .choices{display:flex;flex-direction:column;gap:10px}
  .choice{all:unset;display:block;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.97rem;transition:background .15s}
  .choice:active{background:var(--accent-soft)}
  .choice.correct{border-color:var(--ok);background:var(--ok-soft)}
  .choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
  .choice[disabled]{cursor:default}
  .result{margin-top:16px;padding:14px;border-radius:12px;font-size:.95rem}
  .result.ok{background:var(--ok-soft)} .result.ng{background:var(--ng-soft)}
  .result .rh{display:block;font-weight:700;margin-bottom:4px}
  .btn{all:unset;box-sizing:border-box;width:100%;display:block;text-align:center;margin-top:16px;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .score{text-align:center;font-size:2.2rem;font-weight:700;color:var(--accent);margin:6px 0}
  .msg{text-align:center;color:var(--sub)}
  h2{font-size:1rem;margin:28px 0 10px}
  .hist{display:flex;flex-direction:column;gap:8px}
  .hrow{all:unset;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:.92rem}
  .hrow .s{color:var(--sub)} .hrow .s.done{color:var(--ok);font-weight:700}
  .review{margin-top:10px;font-size:.92rem}
  .review .item{border-top:1px dashed var(--line);padding:10px 0}
  .review .a{color:var(--ok);font-weight:700}
  .review .mine{margin-top:6px} .review .ngtxt{color:var(--ng)}
  .review .exp{margin-top:6px;color:#5a564e}
  .kw{color:#2b2a27;font-weight:700;font-size:1.18em;margin:0 1px}
  .ngbox,.okbox{margin-top:10px;border-radius:12px;padding:10px 14px;font-size:.95rem;font-weight:700}
  .ngbox{background:#fbe3dd;border:2.5px solid #c0392b;color:#8e2a1c}
  .whyng{margin-top:10px;background:#fff8f0;border:1.5px solid #e9b98a;border-radius:12px;padding:10px 13px;font-size:.93rem;line-height:1.65}
  .whyng .wh{font-weight:700;color:#a0522d;margin-bottom:3px}
  .whysm{margin:4px 0 2px;background:#fff8f0;border-radius:8px;padding:6px 10px;font-size:.86rem;line-height:1.6}
  .okbox{background:var(--ok-soft);border:1.5px solid var(--ok);color:#2f5e3a}
  .ngbox .tt{color:#c0392b;font-size:1.05rem}
  .okbox .tt{color:var(--ok)}
  .menu{margin-top:16px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
  .mrow{all:unset;display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
  .menu .s{color:var(--sub);font-size:.82rem}
  .mascot{display:flex;align-items:center;gap:10px;margin:-4px 0 14px}
  .mascot .face{width:76px;height:76px;flex:none}
  .mascot .face svg{width:100%;height:100%}
  .bubble{position:relative;flex:1;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.92rem;min-height:44px}
  .bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
  .bubble:after{content:"";position:absolute;left:-6px;top:19px;border:7px solid transparent;border-right-color:#fff;border-left:0}
  .bubble .nm{display:block;font-size:.72rem;color:#c0392b;font-weight:700}
  .mascot.pop .face{animation:hop .45s ease}
  @keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
  .illus{width:84px;height:84px;margin:4px auto 10px;background:var(--accent-soft);border-radius:50%;padding:8px}
  .illus svg{width:100%;height:100%}
  .confetti{position:absolute;inset:0;pointer-events:none}
  .confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.6s ease-in forwards}
  @keyframes fall{to{top:110%;transform:rotate(540deg)}}
  .medal{width:80px;height:80px;margin:4px auto 0}
  .flowers{display:flex;justify-content:center;gap:8px;margin-top:6px}
  .flowers .fl{width:36px;height:36px} .flowers .bone{width:80px;height:40px}
  .newb{display:inline-block;margin-left:6px;background:#c0392b;color:#fff;border-radius:999px;padding:1px 10px;font-size:.75rem;vertical-align:1px}
  .ov{position:fixed;inset:0;z-index:50;background:rgba(245,242,236,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:ovin .25s ease;cursor:pointer}
  .ov.out{animation:ovout .35s ease forwards}
  @keyframes ovin{from{opacity:0}to{opacity:1}} @keyframes ovout{to{opacity:0}}
  .ov .stage{position:relative;width:240px;height:200px;display:flex;align-items:flex-end;justify-content:center}
  .ov .big{width:190px;height:230px}
  .ov .big svg,.ov .sitluna svg{width:100%;height:100%;overflow:visible}
  .ov .stage{height:250px;width:260px}
  /* しっぽ：ふつう→ゆっくり、全問正解・7日連続→ぶんぶん */
  .ov .tail{animation:wag .32s ease-in-out infinite alternate}
  .ov .big.perfect .tail,.ov.weekly .tail{animation:wag .14s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
  /* 表情の切りかえ */
  .ov .fb{opacity:0;animation:showface 0s linear .55s forwards}
  .ov .fa{animation:hideface 0s linear .55s forwards}
  .ov .big.perfect .fa{animation:none}
  @keyframes showface{to{opacity:1}} @keyframes hideface{to{opacity:0}}
  .ov.weekly .fb,.ov.weekly .fa{animation-delay:.7s}
  /* 7日連続：野原でステーキ */
  .ov.weekly{background:#f3f8f2}
  .ov .meadow{position:absolute;inset:0;width:100%;height:100%}
  .ov .wtext{position:absolute;top:14%;left:0;right:0;text-align:center;z-index:2}
  .ov .feast{position:absolute;left:50%;bottom:9%;width:240px;height:330px;transform:translateX(-50%)}
  .ov .sitluna{position:absolute;left:30px;bottom:70px;width:180px;height:232px;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
  .ov .steak{position:absolute;left:20px;bottom:0;width:200px;height:88px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) .3s both}
  .ov .steam path{animation:steam 1.1s ease-in-out infinite}
  .ov .steam path:nth-child(2){animation-delay:.35s} .ov .steam path:nth-child(3){animation-delay:.7s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.6}100%{opacity:0;transform:translateY(-8px)}}
  .ov .hearts{position:absolute;inset:0}
  .ov .hearts .fl2{bottom:200px;color:#e98a8a}
  /* 上の案内役：まばたき・耳ぴくっ */
  .mascot .eyes{animation:blink2 4.5s infinite}
  @keyframes blink2{0%,93%,97%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .mascot .earR{animation:twitch 6s infinite}
  @keyframes twitch{0%,88%,94%,100%{transform:rotate(0)}90%{transform:rotate(-12deg)}92%{transform:rotate(6deg)}}

      c: ["リンクを押して再配達を申し込む", "リンクは押さず、宅配会社の公式アプリや伝票の番号で確認する", "返信して本物かどうか聞いてみる", "友だちに転送して意見を聞く"],
      a: 1,
      w: ["リンク先は**偽サイト**で、カード番号やパスワードを盗まれたり、あやしいアプリを入れられたりします。", "", "返信すると、**この番号は使われている**と相手に知られ、さらに詐欺のメッセージが届くようになります。", "転送された友だちが、うっかり**リンクを押してしまう**かもしれません。被害を広げてしまいます。"],
      e: "宅配業者をよそおった**偽SMS**はとても多い手口です。リンク先は偽サイトで、個人情報やカード番号を盗まれたり、ウイルス入りのアプリを入れさせられたりします。**届いたリンクは使わず**、自分で**公式アプリやブックマークから確認**するのが鉄則です。",
      img: "sms", colt: "偽SMSはなぜ本物そっくり？", col: "偽SMSは、宅配会社や銀行、携帯会社など、だれもが使う会社の名前をかたって送られてきます。たくさんの人に一斉に送れば、ちょうど荷物を待っている人が引っかかるからです。リンク先のサイトも、ロゴや色まで**本物そっくり**に作られています。SMSは送り主の名前を偽ることもでき、本物の会社からのメッセージと同じ画面に並ぶこともあります。「見た目で見分ける」より「**リンクは使わない**」と決めておくのがいちばん確実です。", ng: "SMSやメールに届いたリンクを押す", ok: "宅配会社の公式アプリや、伝票の番号で確認する" },
    { q: "次のうち、いちばん破られにくいパスワードはどれ？", pts: ["いちばん効くのはパスワードの**長さ**", "誕生日・名前・よくある単語は一瞬で破られる", "関係ない単語をつなげて**12文字以上**に"],
      c: ["kitsune-ame-tsukimi-28yama", "20080315（誕生日）", "password123", "sakura"],
      a: 0,
      w: ["", "誕生日は、SNSのプロフィールなどから**すぐ調べられて**しまいます。", "「password123」は、**よく使われるパスワードの上位**で、真っ先にためされます。", "短い1単語は、**一瞬で破られます**。長さがいちばん大事です。"],
      e: "パスワードは「**長さ**」がいちばん効きます。誕生日や名前、よくある単語は、機械で一瞬で試されてしまいます。関係のない単語をいくつかつなげると、長くて覚えやすいパスワードになります。目安は**12文字以上**で、ゲームやSNSのアカウントも同じです。",
      img: "key", colt: "長さが効くのはなぜ？", col: "パスワードを破る方法のひとつに、機械で組み合わせを片っぱしから試す「**総当たり**」があります。1文字増えるごとに組み合わせの数はかけ算で増えるので、長くするほど時間がかかり、現実的には破れなくなります。一方、誕生日や名前、よく使われる単語は、最初に試される「よくあるパスワード」に入っていることが多く、すぐに破られてしまいます。関係のない単語を3〜4個つなげると、**長くて覚えやすく、推測もされにくい**パスワードになります。", rep: "password", ng: "誕生日・名前・よくある単語をパスワードにする", ok: "関係のない単語をつなげて、12文字以上にする" },
    { q: "オンラインゲームで仲良くなった人から、こんなメッセージが来ました。どうする？", scene: {"t": "game", "from": "ゲーム仲間", "msg": "レアアイテムをプレゼントしたいから、ログインIDとパスワード教えて！"}, pts: ["教えると**アカウントを乗っ取られる**", "パスワードを聞いてくる人は、友だちでも運営でもいない", "やりとりをやめて、**ブロック・通報・家族に相談**"],
      c: ["仲良しだから、IDとパスワードを教える", "IDもパスワードも教えず、やりとりをやめる。しつこければブロック・通報する", "パスワードを少しだけ変えて教える", "IDだけなら教えても大丈夫"],
      a: 1,
      w: ["教えた瞬間に**アカウントを乗っ取られ**、アイテムやデータを全部取られてしまいます。", "", "少し変えただけのパスワードは、**試せばすぐ当てられて**しまいます。", "IDがわかると、相手は**パスワードを当てようとする**ことができます。どちらも教えないのが安全です。"],
      e: "IDとパスワードを教えると、**アカウントを乗っ取られ**て、アイテムやお金を取られたり、あなたのふりをして友だちに詐欺のメッセージを送られたりします。友だちでも運営の人でも、**パスワードを聞いてくる人はいません**。困ったら、家族やゲームの運営に相談しましょう。",
      img: "sns", colt: "アカウントがねらわれるのはなぜ？", col: "ゲームやSNSのアカウントには、課金したアイテムや友だちとのつながり、写真や思い出がつまっています。だからこそ、それをねらう人がいます。乗っ取られると、アイテムを売られたり、あなたのふりをして友だちにだましのメッセージを送られたりすることもあります。「プレゼントする」「手伝ってあげる」など、**親切な言葉で近づいてくる**のがよくある手口です。パスワードは**だれにも教えない**、と決めておきましょう。", ng: "ゲームやSNSで知り合った人に、IDやパスワードを教える", ok: "やりとりをやめて、ブロックやゲームの運営に通報する" },
    { q: "こんな電話が来て、ビデオ通話の画面には制服姿の人と逮捕状が映っています。どうする？", scene: {"t": "call", "from": "警察を名乗る人", "icon": "👮", "msg": "警察です。あなたの口座が犯罪に使われています。LINEのビデオ通話で取り調べをします"}, pts: ["これは**ニセ警察詐欺**。2026年1〜6月の被害は約508億円", "警察が**ビデオ通話で取り調べ**や逮捕状を見せることはない", "電話を切って**#9110か家族に相談**"],
      c: ["本物の警察だと思うので、言われたとおりお金を振り込む", "身の潔白を証明するため、口座番号や暗証番号を伝える", "電話を切り、自分で調べた警察署の番号か「#9110」に相談する", "「家族には内緒に」と言われたので、ひとりで対応する"],
      a: 2,
      w: ["本物の警察が、電話で**お金の振込を求めることはありません**。振り込んだお金は、まず戻りません。", "暗証番号を伝えると、**口座のお金を引き出されて**しまいます。警察が暗証番号を聞くことはありません。", "", "「内緒に」は、**相談させないための手口**です。だれにも言わずにいると、だまされたことに気づけません。"],
      e: "これは「**ニセ警察詐欺**」です。警察庁によると、2026年1〜6月の被害額は約508億円で、前の年の同じ時期より約109億円増えています。警察庁は、**警察がビデオ通話で取り調べをしたり、サイトで逮捕状を見せたりすることはない**と注意を呼びかけています。2026年9月の民間の調査では、20代の約半数がこの手口を「知らない」と答えていて、若い人も他人ごとではありません。",
      img: "phone", colt: "なぜ信じてしまうの？", col: "ニセ警察詐欺では、犯人が**本物の警察署と同じ番号に見せかけて**電話をかけてきたり、制服姿でビデオ通話に出てきたり、本物そっくりの逮捕状を見せたりします。「あなたが事件に関わっている」と言われると、だれでも不安になって冷静さを失います。さらに「秘密の捜査だから家族にも言わないで」と**口止め**して、相談させないようにするのも特徴です。少しでもおかしいと思ったら、いったん電話を切り、家族や#9110に相談しましょう。", news: true, ng: "警察を名乗る相手の指示で、お金を振り込む・口座の情報を伝える", ok: "すぐ電話を切り、#9110（警察相談専用電話）か家族に相談する" },
    { q: "「二段階認証（2段階認証）」の説明として正しいのはどれ？", pts: ["パスワード＋スマホに届くコードなど**別の確認**", "パスワードが盗まれても**ログインを防げる**", "届いたコードは**絶対に人に教えない**"],
      c: ["パスワードを2回入力すること", "パスワードを2つ用意して交互に使うこと", "ログインを2回に1回にする設定", "パスワードに加えて、スマホに届く番号など“別の確認”も求める仕組み"],
      a: 3,
      w: ["同じパスワードを2回入れても、**盗まれたら同じこと**です。守りは強くなりません。", "2つのパスワードも、両方盗まれたら終わりです。二段階認証は**パスワードとは別の確認**を使います。", "そんな設定はありません。二段階認証は、**ログインのたびに別の確認**をする仕組みです。", ""],
      e: "二段階認証は、パスワードが盗まれても、**スマホに届くコード**など「本人の手元にあるもの」がないとログインできない仕組みです。GmailやLINE、Instagram、ゲームのアカウント、ネット銀行など大事なサービスでは、ぜひ**オンに**しておきましょう。ただし、そのコードを**人に教えるのは絶対にNG**です。",
      img: "twofa", colt: "二段階認証って何種類あるの？", col: "二段階認証には、SMSで届く番号を入れる方法のほかに、「**認証アプリ**」に表示される番号を入れる方法や、スマホに届いた通知を「承認」する方法などがあります。どれも「パスワード＋本人の手元にあるもの」の組み合わせで、パスワードだけ盗まれてもログインを防げます。設定するときに表示される「**バックアップコード**」は、スマホをなくしたときに必要になるので、紙にメモして大切に保管しておきましょう。", rep: "twofa", ng: "届いた確認コードを人に教える（電話やDMで聞かれても）", ok: "LINE・Instagram・ゲームなど大事なアカウントは二段階認証をオンにする" }
  ]

{
  day: 2, v: 2, date: "2026-11-03", level: "Lv.1 超入門", theme: "本物そっくりに注意",
  qs: [
    { q: "警察を名乗る人に「詳しくはホームページを見て」と言われ、教えられたサイトを開くとこんな画面でした。どうする？", scene: {"t": "web", "from": "◯◯県警察", "addr": "本物そっくりのアドレス", "msg": "【重要】あなたが関わる事件について捜査中です。下のフォームに情報を入力してください。"}, pts: ["2026年9月ごろ、警察そっくりの**偽サイト**が見つかった", "**相手に教えられたサイト**は確認にならない", "電話を切って、**自分で調べた番号か#9110**へ"],
      c: ["公式サイトに見えるので、書かれた指示に従う", "デザインが本物そっくりなので、信用して連絡先を入力する", "そのサイトは信用せず、電話を切って自分で調べた警察署の番号や「#9110」に相談する", "サイトのお問い合わせ先に電話して確かめる"],
      a: 2,
      w: ["公式サイトに**そっくりに作った偽サイト**かもしれません。教えられたサイトは、確認の手がかりになりません。", "デザインは、まねすれば**だれでも本物そっくり**にできます。入力した情報は犯人に送られます。", "", "サイトに書かれた電話番号も**犯人の番号**です。確かめるなら、自分で調べた番号にかけます。"],
      e: "2026年9月ごろ、警視庁や一部の県警の公式サイトに**よく似た偽サイト**が見つかり、警察庁などが注意を呼びかけました。ニセ警察詐欺では、**見た目が本物そっくり**でも信用できません。警察が**ホームページを見せて個人情報の入力やお金の話をする**ことはないので、電話を切って**#9110**や家族に相談しましょう。",
      img: "alert", colt: "公式サイトを見せられたら安心？", col: "偽サイトは、ロゴや色づかいまで本物をまねて作られています。犯人は「ほら、公式サイトにも書いてあるでしょう」と見せることで、相手を安心させようとします。ここで大事なのは、**相手から教えられたサイトは確認にならない**ということです。本物かどうかを確かめたいときは、**自分で調べた番号**にかけ直すか、#9110に相談します。「相手が見せてきたもので確かめない」と覚えておきましょう。", news: true, ng: "相手に教えられたサイトや番号を、確認のために使う", ok: "電話を切り、自分で調べた番号か#9110、家族に相談する" },
    { q: "毎日こんな通知が出ますが、いつも「あとで」を押しています。このままだとどうなる？", scene: {"t": "notif", "from": "設定", "icon": "⚙️", "msg": "ソフトウェアアップデートがあります。\n［今すぐインストール］［あとで］"}, pts: ["アップデートには**弱点（脆弱性）をふさぐ修正**が入っている", "「あとで」の間は、その弱点を**ねらわれやすい**", "設定→一般→ソフトウェアアップデートで**自動をオン**"],
      c: ["古いままだと、見つかった弱点（脆弱性）をねらわれやすくなる", "スマホが軽くなって、むしろ安全になる", "アップデートしてもしなくても、安全さは変わらない", "新しい機能が使えないだけで、安全面は問題ない"],
      a: 0,
      w: ["", "アップデートしないと、見つかった弱点が**そのまま残ります**。軽くなっても安全にはなりません。", "アップデートには**弱点をふさぐ修正**が入っています。しないと危険が残ります。", "新しい機能だけでなく、**弱点をふさぐ修正**も入っています。安全面にも関係します。"],
      e: "アップデートには、新しい機能だけでなく、見つかった**弱点（脆弱性）をふさぐ修正**が入っています。古いままだと、その弱点をねらうウイルスや攻撃を受けやすくなります。iPhoneなら、**「設定」→「一般」→「ソフトウェアアップデート」**を開き、**自動アップデートをオン**にしておくと、寝ている間に更新されて手間がかかりません。",
      img: "update", colt: "「あとで」がいちばん危ないのはなぜ？", col: "弱点が見つかって修正版が出ると、その弱点の情報も世の中に知られます。すると、まだ更新していない人が**ねらい目**になります。つまり、「あとで」を続けるほど、無防備な期間が長くなるのです。アップデートは、家の鍵の修理のようなものです。新しい鍵が届いたのに、ずっと古い鍵のまま出かける人はいませんよね。充電しながら寝る前に、5分でできます。", rep: "update", ng: "アップデートの通知を、ずっと「あとで」にし続ける", ok: "今日、設定の「ソフトウェアアップデート」を開いて、自動アップデートをオンにする" },
    { q: "友だちと撮った写真をSNSに投稿するとき、いちばん気をつけたいことはどれ？", pts: ["写真は消しても**コピーが残る**ことがある", "制服・看板・景色から**場所がわかる**ことも", "**公開範囲と写り込み**を確認してから投稿"],
      c: ["公開範囲は初期設定のままでよい", "友だちは気にしないので、顔が写っていても確認せず投稿する", "自分の顔だけ隠せば、ほかは写っていても問題ない", "公開範囲を確認し、友だちや背景（制服・看板・家の周り）も確認してから投稿する"],
      a: 3,
      w: ["初期設定が**だれでも見られる公開**になっていることがあります。投稿前に確かめましょう。", "友だちが**顔を出したくない**こともあります。勝手に投稿するとトラブルになります。", "制服や看板など、**背景から学校や家がわかる**ことがあります。顔だけ隠しても足りません。", ""],
      e: "SNSの写真は、一度出ると**消してもコピーが残る**ことがあります。公開範囲が「全員」だと、知らない人にも見られます。**友だちの顔**や、**制服・看板・家の周りの景色**から、通っている場所や住んでいる場所が特定されることもあります。投稿前に**公開範囲**と**写り込み**を確認しましょう。",
      img: "sns", colt: "背景から場所がバレる？", col: "写真の中には、本人が気づかない情報がたくさんあります。たとえば制服や校章、駅の名前、近所のお店の看板、窓の外の景色などです。これらを組み合わせると、**どこにいるのか、どこに住んでいるのか**を、知らない人が推測できてしまうことがあります。友だちが写っている場合は、**投稿していいか本人に聞く**のもマナーです。迷ったら、投稿しない選択も大切です。", ng: "公開範囲も写り込みも確認せず、友だちの写真を投稿する", ok: "投稿前に公開範囲を「友だちだけ」などにして、背景も確認する" },
    { q: "ゲーム仲間から、こんなメッセージが来ました。どうする？", scene: {"t": "game", "from": "ゲーム仲間", "msg": "コンビニで買った電子マネーのコード教えてくれたら、課金アイテム半額で買ってあげるよ！"}, pts: ["電子マネーのコードは**教えた時点でお金として使われる**", "「半額で買ってあげる」は**代行詐欺**のよくある形", "課金は**公式ストアだけ**。誘われたら家族や運営に相談"],
      c: ["半額はお得なので、コードを教える", "コードは教えず、やりとりをやめて、保護者やゲームの運営に相談する", "一部のコードだけ教えて様子を見る", "友だちにも教えて、いっしょに頼む"],
      a: 1,
      w: ["教えた瞬間に、**コードのお金を使われて**しまいます。アイテムは届きません。", "", "一部でも、**そのぶんのお金を使われます**。様子を見る意味はありません。", "友だちも**同じ被害にあって**しまいます。被害が広がるだけです。"],
      e: "電子マネーのコードは、**番号を教えただけでお金として使われてしまう**ので、取り戻すのがとても難しいです。「半額で買ってあげる」という誘いは**代行詐欺**のよくある形で、コードだけ取られて何も届かないことがあります。誘われたら、**やりとりをやめて**、家族やゲームの運営に相談しましょう。困ったら**188**（消費者ホットライン）でも相談できます。",
      img: "card", colt: "コードを教えるとどうなるの？", col: "電子マネーのコードは、番号を相手に伝えた時点で、その金額を使える状態になります。カードと違って、本人確認がなく、あとから止めるのが難しいのが特徴です。だから詐欺をする人は、お金を直接受け取らずに**コードを聞き出そう**とします。「お得」「半額」「特別に」という言葉は、だます側がよく使う誘い文句です。ゲームの課金は、**公式のストアからだけ**行いましょう。", ng: "電子マネーのコードを、ゲーム仲間や知らない人に教える", ok: "課金は公式のストアだけで行い、誘われたら保護者や運営に相談する" },

    { q: "サービスから「個人情報が漏えいした」とメールが届きました。まずどうする？", c: ["メールのボタンから、すぐにパスワードを変更する", "メールのリンクは使わず、公式アプリやブックマークから、何の情報が漏れたかを確認する", "本当か知りたいので、メールに返信して聞く", "自分には関係ないと思って、何もしない"], a: 1, w: ["メールのボタンが**偽サイトにつながっている**こともあります。漏えいのお知らせをよそおう詐欺もあります。", "", "返信は、**偽メールなら犯人に届く**だけです。確かめるなら、自分で公式サイトを開きます。", "同じパスワードを使っていると、**ほかのサービスにも入られる**おそれがあります。"], e: "IPA（情報処理推進機構）は**2026年10月26日**、個人情報などが漏えいしたときの**対処と日ごろの対策**を紹介しました。国内で不正アクセスによる漏えいの公表が相次ぎ、相談も多く寄せられているためです。まず**自分のどんな情報が漏れたか**を事業者の公式な案内で確かめることが大切で、メールのリンクは使わず**公式アプリやブックマーク**から確認しましょう。同じパスワードを使い回していたら、ほかのサービスも変えてください。", img: "mail", scene: {"t": "mail", "from": "利用中のサービスをよそおう差出人", "subj": "【お詫び】個人情報漏えいのお知らせ", "msg": "不正アクセスにより、お客様の情報が漏えいした可能性があります。下のボタンからパスワードを変更してください。", "link": true}, pts: ["漏えい通知の**偽メール**も多い", "まず**何の情報が漏れたか**を公式で確認", "同じパスワードは**ほかも変える**"], colt: "漏えいのあとに何が起きる？", col: "漏えいのニュースを見ると不安になりますが、本当に気をつけたいのは、そのあとです。漏れたメールアドレスや電話番号は、**フィッシングメールや偽SMSの宛先**に使われることがあります。さらに、漏れたパスワードは**ほかのサービスで試される**ので、使い回しがいちばん危険です。IPAは日ごろの対策として、**長くて使い回さないパスワード**や**多要素認証・パスキー**、個人情報の登録を**必要最小限**にすることなどを挙げています。「お詫び」のメールが届いても、まずは**自分で公式の窓口を確かめる**のが近道です。", ng: "メールのボタンから急いで入力する", ok: "メールのリンクは押さず、公式アプリで確認", news: true },
    { q: "SNSで見つけたバイトに応募したら、こんな返事が来ました。どうする？", c: ["お金が必要なので、身分証の写真を送る", "まず試しに1回だけやってみる", "やりとりをやめ、家族や信頼できる大人、警察の相談窓口（#9110）に相談する", "友だちを誘って、いっしょに応募する"], a: 2, w: ["身分証の写真で、**脅されて抜けられなくなる**のが闇バイトの手口です。", "1回でも犯罪に加わると、**逮捕されたり、脅されて続けさせられたり**します。", "", "友だちも**犯罪に巻きこんで**しまいます。"], e: "「高収入」「即日現金」「荷物を受け取るだけ」とさそう**闇バイト**は、詐欺などの**犯罪の実行役**をさせられる仕事です。身分証の写真や家族の情報を送ると、それを材料に**「やめたら家族に知らせる」とおどされ**、抜けられなくなります。少しでも不安になったら、すぐにやりとりをやめて、**家族や警察（#9110）**に相談しましょう。やってしまうと、自分が加害者として罪に問われます。", img: "sns", scene: {"t": "dm", "from": "高収入バイト募集", "msg": "【即日現金】スマホ1つでOK！荷物を受け取るだけで高収入。詳しくは別のアプリで連絡して。身分証の写真も送ってね。"}, pts: ["**高収入・即日・簡単**は闇バイトの合図", "身分証を送ると**弱みをにぎられる**", "迷ったら**すぐ家族や警察に相談**"], colt: "なぜ「簡単」な仕事ほど危ないの？", col: "本当に簡単で高収入の仕事なら、わざわざ知らない人に声をかける必要はありません。**誰かがやりたがらない危険な部分**を、お金で釣った人にやらせているのです。最初は「ただの荷物の受け取り」と言われても、あとから**犯罪だと気づいたときには逃げられない**ように、身分証や家族の情報を先に集められます。使い捨ての実行役にされて、逮捕されるのは**やった本人**です。バイトは、会社名と所在地がはっきりした求人で探しましょう。", ng: "身分証の写真や住所を送る", ok: "バイトは会社名がわかる求人サイトで探す" },
    { q: "カフェの無料Wi-Fiにつなげます。ネットバンクの確認をしたいとき、どうする？", c: ["大事な操作は、携帯の回線（モバイルデータ）でする", "パスワードなしでも、いつも暗号化されているから安心", "店名に似た名前のWi-Fiなら、どれも本物だと考える", "つないだら、そのままなんでも入力してよい"], a: 0, w: ["", "パスワードなしのWi-Fiは、**暗号化されていない**ことがあります。", "店名に似せた**偽のWi-Fi**を、犯人が用意していることがあります。", "入力した内容を、**同じWi-Fiの人に見られる**おそれがあります。"], e: "パスワードなしの無料Wi-Fiは、通信が**暗号化されていない**ことがあり、同じ場所にいる人にのぞかれるおそれがあります。また、店名そっくりの名前の**偽Wi-Fi**でつないだ人の情報をねらう手口もあります。ネットバンクや買い物など**大事な操作は、モバイルデータ（携帯の回線）**でするのが安全です。使うときは店員さんに正しい名前を聞き、使い終わったら**接続を切り**ましょう。", img: "wifi", scene: {"t": "notif", "from": "Wi-Fi", "icon": "📶", "msg": "「Free_Cafe_WiFi」に接続しますか？\n（パスワードなし）"}, pts: ["パスワードなしは**のぞかれる**おそれ", "店名そっくりの**偽Wi-Fi**もある", "大事な操作は**携帯の回線**で"], colt: "偽のWi-Fiはどう作られる？", col: "偽Wi-Fiは、スマホ1台あれば「Free_Cafe_WiFi」のような**それらしい名前**で作れてしまいます。つないだ人の通信を中継すれば、**入力した内容をのぞこうとする**ことも可能になります。見分けるのは難しいので、**その場所のお店に正しい名前とパスワードを聞く**のがいちばんです。そして、パスワードや暗証番号を入れる場面では、**そもそも無料Wi-Fiを使わない**と決めておくと安心です。", ng: "無料Wi-Fiでネットバンクにログインする", ok: "大事な操作は、携帯の回線（モバイルデータ）で" },
    { q: "LINEで友だちから、こんなトークが届きました。どうする？", c: ["友だちだから、すぐ買って番号を送る", "断ると悪いので、少額だけ送る", "同じトークで「本当にあなた？」と聞いて、返事が来たら送る", "電話や直接会うなど別の方法で本人に確かめ、確認できるまで送らない"], a: 3, w: ["友だちのアカウントが**乗っ取られている**かもしれません。番号を送ると、すぐ使われてしまいます。", "少額でも**そのぶん使われます**。断るのは悪いことではありません。", "乗っ取った人が、**本人のふりをして返事**をしてきます。同じトークでは確かめられません。", ""], e: "友だちの**アカウントが乗っ取られ**て、そのふりをしてギフトカードの番号を求める手口があります。同じトークで聞いても**犯人が返事をする**ので、確認にはなりません。**電話や直接会うなど、別の方法**で本人に確かめましょう。ギフトカードの番号は、教えた時点で**お金として使われてしまう**ので、取り戻すのがとても難しいです。", img: "sns", scene: {"t": "chat", "from": "友だち（名前もアイコンも同じ）", "msg": "いま手が離せなくて…コンビニでギフトカードを買って、番号を写真で送ってくれない？あとで返すね！"}, pts: ["友だちの**乗っ取り**かもしれない", "番号を送ると**お金として使われる**", "**別の方法**で本人確認する"], colt: "友だちのふりはなぜできるの？", col: "アカウントを乗っ取られると、犯人は**過去のトークの口ぐせ**まで読めてしまいます。だから、本人そっくりの文章でメッセージを送れるのです。名前とアイコンが同じでも、**中身は別人**かもしれません。お金やコードを頼まれたときは、**「電話で話そう」と返す**だけで、犯人は逃げていくことが多いです。自分のアカウントを守るためにも、パスワードを使い回さないことが大切です。", ng: "ギフトカードの番号を写真で送る", ok: "お金の話は、電話や会って本人に確かめる", set: true },
    { q: "スマホの写真をバックアップしていないと、どうなる？", c: ["機種変更をすれば、バックアップなしでも自動で全部戻る", "iPhoneが壊れたり、なくなったりすると、写真が戻らなくなることがある", "水に濡れても、本体に入っていれば必ず直る", "バックアップは大人だけに必要で、学生には関係ない"], a: 1, w: ["機種変更でも、**バックアップがないと写真は戻りません**。", "", "水にぬれたり壊れたりすると、**写真を取り出せない**ことがあります。", "学生でも、思い出の写真や大事なデータは**なくしたら戻りません**。"], e: "スマホは、落としたり、水に濡らしたり、盗まれたりすると、**データごと失う**ことがあります。**バックアップ**とは、写真や連絡先を別の場所にコピーしておくことです。iPhoneなら**iCloud**などを使って**自動でバックアップ**する設定にしておけば、買い替えやなくしたときにも戻せます。保存できる容量には限りがあるので、足りないときは**大事な写真だけ**パソコンなどにも保存しましょう。", img: "backup", pts: ["本体だけだと**壊れたら消える**", "**自動バックアップ**をオンにする", "容量が足りなければ**大事な物だけ**別に保存"], colt: "バックアップは何か所に取るといい？", col: "データを守る考え方に、「**3つのコピー**を、**2種類の保存先**に、うち**1つは別の場所**に」という「3-2-1」ルールがあります。大事な写真なら、スマホ本体、クラウド、パソコンや外付けの機器、のように分けるイメージです。同じ場所だけに保存していると、**災害や盗難でまとめて失う**おそれがあります。最初は完ぺきを目指さず、**自動でクラウドに保存する設定**から始めるのがおすすめです。", ng: "バックアップせず、本体だけに写真をためる", ok: "iPhoneの「設定」→自分の名前→「iCloud」で、バックアップの状態を確認する", rep: "backup" }
  ]
},
{"day": 5, "date": "2026-11-06", "level": "Lv.2 入門", "theme": "表示番号を信じない", "qs": [{"q": "携帯に、警察署の番号が表示された電話が来ました。どうする？", "c": ["警察署の番号と同じか、ネットで調べてから話を続ける", "いったん切り、自分で調べた警察署の番号にかけ直す", "本物か確かめるため、相手の名前と所属を聞く", "家族に心配をかけないよう、まず話を最後まで聞く"], "a": 1, "e": "電話の画面に出る番号は、**にせることができます**。本物の警察署の番号が出ても、相手が警察とは限りません。名前や所属を聞いても、うそを言われたら見分けられません。**いったん切って、自分で調べた番号か#9110**で確かめるのが確実です。警察庁は2026年10月にも、この**ニセ警察詐欺**への注意を呼びかけています。", "img": "phone", "scene": {"t": "call", "from": "警察署の番号が表示された着信", "icon": "👮", "msg": "あなたの口座が犯罪に使われています。調べるので、切らずに話を聞いてください。"}, "pts": ["電話の**表示番号はにせられる**", "名前や所属を聞いても**見分けられない**", "**一度切って**、自分で調べた番号へ"], "colt": "なぜ警察の番号が出るの？", "col": "電話の画面に出る番号は、特別な仕組みを使うと**別の番号に見せかける**ことができてしまいます。だから、本物の警察署の番号が出ても、**かけてきた相手が警察とは限りません**。犯人は「切らないで」「だれにも言わないで」と言って、**相談する時間をうばおう**とします。電話を切るのは失礼ではありません。**一度切って、家族や#9110に話す**だけで、ほとんどの手口は止まります。", "ng": "表示された番号を信じて、話を続ける", "ok": "一度切って、自分で調べた番号にかける", "news": true, "w": ["ネットで調べると本物の警察署の番号と同じですが、番号は**にせられる**ので確認になりません。話を続けるほど、だまされやすくなります。", "", "名前や所属は、うそでもいくらでも言えます。聞いているあいだも**話が長くなり**、相手のペースに乗せられてしまいます。", "最後まで聞くと、不安をあおられて**言いなりになりやすく**なります。すぐ切って家族に話すほうが、心配をかけずにすみます。"]}, {"q": "iPhoneで、自分の位置情報をだれに見せているか確かめたい。どうする？", "c": ["「設定」の「位置情報サービス」を、まるごとオフにする", "「探す」アプリの地図で、自分の今いる場所を確かめる", "「探す」アプリの「人を探す」で、共有している相手を見る", "「位置情報サービス」で、位置情報を使うアプリを見る"], "a": 2, "e": "「探す」アプリの**「人を探す」**には、位置情報を共有している相手が並んでいます。**家族以外の名前がないか**を見て、知らない人や今は必要ない人がいたら、共有をやめましょう。位置情報サービスをまるごとオフにすると、**家族との見守りも止まってしまう**ので、相手を見直すほうが安心です。", "img": "shield", "pts": ["**「人を探す」**に共有の相手が出る", "**家族以外**がいないか確認", "まるごとオフは**見守りも止まる**"], "colt": "共有したまま、忘れていない？", "col": "位置情報の共有は、一度オンにすると**そのまま忘れがち**です。待ち合わせのときだけ共有した友だちなど、今は必要のない相手が残っていることもあります。家族との共有は**見守りに役立つ**ので、残しておいて大丈夫です。**月に一度**、共有している相手を見る日を決めておくと安心です。", "ng": "知らない人に、位置情報を共有したままにする", "ok": "家族以外にも共有されていないか確認する", "set": true, "w": ["共有は止まりますが、**家族との見守りや「探す」も使えなく**なります。それに、だれに見せていたかの確認にもなりません。", "地図でわかるのは**自分が今どこにいるか**だけです。だれに見せているかは出てきません。", "", "ここに並ぶのは、位置情報を使う**アプリ**です。位置情報を見せている**人**は、「探す」アプリの「人を探す」で確かめます。"]}, {"q": "パスワードが多すぎて覚えられません。友だちがこう言っています。どう思う？", "c": ["1Passwordなどで、サイトごとに違う強いパスワードにする", "基本の言葉は同じにして、サイトごとに最後の数字だけ変える", "全部同じでもいいので、とても長くて難しいパスワードにする", "大事なサイトだけ別のものにして、ほかは同じにしておく"], "a": 0, "e": "同じパスワードを使い回すと、**どこか1か所から漏れたとき、ほかのサービスにも入られて**しまいます。長くて難しくしても、漏れてしまえば同じです。最後の数字だけ変える方法も**見破られやすい**です。**1Password**などのパスワード管理アプリなら、サイトごとに強いパスワードを作って覚えておいてくれます。", "img": "key", "scene": {"t": "chat", "from": "友だち", "msg": "パスワード、全部同じにしちゃえば覚えるの1個で済むよ！"}, "pts": ["使い回しは**1つ漏れたら全部危ない**", "数字だけ変えても**見破られやすい**", "**1Password**ならサイトごとに作れる"], "colt": "管理アプリは本当に安全？", "col": "「全部まとめて保存して、もし漏れたら？」と心配になりますよね。1Passwordなどの管理アプリは、保存する情報を**暗号化（読めない形に変えること）**して守り、開くときに**Face IDやパスワード**を求めます。さらに**Watchtower（ウォッチタワー）**という機能が、使い回しや漏れたパスワードを教えてくれます。まずは、よく使う**メールのパスワード**から見直してみましょう。", "ng": "全部のサービスに同じパスワードを使う", "ok": "1Passwordの「Watchtower」で、使い回しのパスワードがないか見る", "rep": "manager", "w": ["", "「name2024」「name2025」のように**決まりがあると、すぐ見破られます**。1つ漏れると、ほかのサイトでも試されてしまいます。", "長くて難しくても、どこか1か所から漏れたら**全部のサービスに入られます**。長さより、使い回さないことが大事です。", "大事でないと思ったサイトから漏れたパスワードで、**メールなど大事なアカウントに入られる**ことがあります。"]}, {"q": "投稿した写真を見た知らない人から、こんなDMが来ました。どうする？", "c": ["駅は教えず、学校の名前だけ答えて様子を見る", "「知らない人とは会えません」と返事をしてから、ブロックする", "相手のプロフィールを見て、同じ学校の人なら返事をする", "返事をせずにブロック・通報し、写真に写ったものを見直す"], "a": 3, "e": "制服や駅の看板など、写真の**写り込み**から、学校や住んでいる場所がわかることがあります。断りの返事でも、相手は**やりとりを続けるきっかけ**にします。返事はせず**ブロックと通報**をして、写真に手がかりが写っていないか見直しましょう。不安なときは、家族や先生に相談してください。", "img": "sns", "scene": {"t": "dm", "from": "知らない人", "msg": "その制服、近くの高校だよね？いつもどこの駅で降りるの？今度会おうよ。"}, "pts": ["写真の**写り込み**から場所がわかる", "断りの返事も**しない**", "**ブロックと通報**、写真の見直し"], "colt": "写真から何がわかるの？", "col": "1枚の写真でも、**背景の看板、電柱の番号、窓から見える建物**などを組み合わせると、撮った場所がほぼわかってしまうことがあります。さらに、スマホで撮った写真には**位置情報**が入っていることもあり、投稿するアプリによっては取り除かれますが、**すべてがそうとは限りません**。投稿する前に、**背景に何が写っているか**を一度確認するくせをつけましょう。", "ng": "知らない人に、学校や駅の名前を教える", "ok": "返事をせず、ブロックして通報する", "w": ["学校の名前がわかるだけで、**通学路や最寄り駅もしぼりこまれます**。知らない人には何も教えないのが安全です。", "断りの返事でも、相手は**「読んでいる」とわかり**、別のアカウントからまた連絡してくることがあります。返事はしないのが安全です。", "プロフィールには**うそが書ける**ので、本当に同じ学校の人とは限りません。", "   $("meta").textContent = `${day.day}日目（${fmt(day.date)}）・テーマ：${day.theme}`;
  $("level").textContent = key==="y" ? "🔁 昨日の復習" : "🔁 1週間前の復習";
  showQ(); renderMenu();
  say(key==="y" ? "昨日の問題だワン。おぼえてるかな？" : "1週間前の問題だワン。思い出せるかな？");
}

const RV_WORDS = {
  y: { call:"さあ、昨日の復習するよー！", btn:"昨日の復習をはじめる", title:"🔁 昨日の復習タイム！", sub:"昨日の5問、おぼえてるかな？" },
  w: { call:"つぎは1週間前の問題だワン！", btn:"1週間前の復習をはじめる", title:"🔁 1週間前の復習タイム！", sub:"ちゃんと思い出せるかな？" },
  t: { call:"つぎは今日の5問だワン！", btn:"今日の5問をはじめる", title:"", sub:"" }
};
function remainText(nx){
  const st = steps(); const left = st.filter(x=>!x.done).length;
  return left<=1 ? "これが今日さいごのメニュー！" : `今日のメニュー あと${left}つ`;
}
function nextBox(nx){
  const w = RV_WORDS[nx.key];
  return `<div class="nextbox"><div class="nbface">${luna("happy")}</div><div class="nbtxt"><b>${w.call}</b><span>${fmt(nx.day.date)}の5問・テーマ：${nx.day.theme}</span></div></div>
    <button class="btn nbbtn" id="goNext"><span class="nbshine"></span><span class="nbl">${luna("happy")}</span><span class="nbt">${w.btn}！<small>${remainText(nx)}</small></span><span class="nbarrow">▶</span></button>
    <div class="nbtap">🐾 タップしてね 🐾</div>`;
}
function reviewIntro(key, go){
  const w = RV_WORDS[key];
  const ov = document.createElement("div");
  ov.className = "ov intro";
  ov.innerHTML = `<div class="ititle">${w.title}</div><div class="big sitting normal">${lunaSit("normal","happy","")}</div><div class="isub">${w.sub}<br><small>選択肢の順番は入れかわってるよ</small></div><div class="tap">タップですぐはじめる</div>`;
  document.body.appendChild(ov);
  let done = false;
  const end = () => { if (done) return; done = true; go(); ov.classList.add("out"); setTimeout(()=>ov.remove(), 350); };
  ov.onclick = end;
  setTimeout(end, 1600);
}
let firstShow = true;
function toLuna(){
  const m = $("mascot"); if (!m) return;
  const y = m.getBoundingClientRect().top + window.scrollY - 6;
  window.scrollTo({top: Math.max(0,y), behavior: "auto"});
}
function startStep(st){ if (st.key==="t") startDay(todayDay); else startReview(st.key); }

function dots(){
  return `<div class="progress">${S.qs.map((q,i)=>{
    let cls = "dot";
    if (i < S.picks.length) cls += S.picks[i]===q.a ? " ok" : " ng";
    else if (i === S.idx) cls += " now";
    return `<span class="${cls}"></span>`;
  }).join("")}</div>`;
}

function showQ(){
  const q = S.qs[S.idx];
  $("app").innerHTML = `<div class="card">${dots()}
    ${scene(q)}<div class="qnum">${q.label} / ${S.qs.length}${q.news?` <span class="newb">🆕 最近の手口</span>`:""}</div>
    <div class="qtext">${q.q}</div>
    <div class="choices">${q.c.map((t,i)=>`<button class="choice" data-i="${i}">${t}</button>`).join("")}</div>
    <div id="res"></div></div>`;
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => answer(+b.dataset.i));
  if (firstShow) firstShow = false; else toLuna();
}

function answer(i){
  const q = S.qs[S.idx];
  S.picks.push(i);
  document.querySelectorAll(".choice").forEach(b=>{
    const n = +b.dataset.i; b.disabled = true;
    if (n === q.a) b.classList.add("correct");
    else if (n === i) b.classList.add("wrong");
  });
  const ok = i === q.a;
  say(ok ? pick(["正解だワン！🐾","さすが！その調子！","バッチリ見やぶったね！"]) : pick(["おっと！ここは気をつけてほしいワン","だまされやすいところだワン。赤い箱をよく見てね"]), ok?"happy":"sad");
  const last = S.idx === S.qs.length - 1;
  $("res").innerHTML = `${explain(q, ok, i)}${tips(q)}
    <button class="btn gonext" id="next"><span class="gshine"></span><span class="gtx">${last?"🎉 結果を見る":"次の問題へ"}</span><span class="garrow">▶</span></button>${column(q)}`;
  $("next").onclick = () => {
    if (last){
      if (S.mode==="day"){
        const isNew = !getRes(S.day) && !(S.day.day in doneEver);
        doneEver[S.day.day] = 1; save(EVER_KEY, doneEver);
        results[S.day.day] = { picks:S.picks, date: TODAY, v: S.day.v||1 }; save(KEY, results);
        renderHist(); showSummary(); toLuna();
        const perfect = S.picks.every((x,i)=>x===S.qs[i].a);
        const doneDays = DAYS.filter(d=>getRes(d)).length;
        const weekly = isNew && doneDays>0 && doneDays % 7 === 0;
        celebrate(perfect ? "perfect" : "normal", weekly ? () => celebrate("weekly") : null);
      } else {
        reviews[TODAY] = { ...rvToday(), [S.key]: S.picks }; save(RV_KEY, reviews);
        renderHist(); showSummary(); toLuna();
        const rperfect = S.picks.every((x,i)=>x===S.qs[i].a);
        celebrate(rperfect ? "perfect" : "normal", null, true);
      }
    } else { S.idx++; showQ(); }
  };
  $("res").scrollIntoView({behavior:"smooth", block:"nearest"});
}

function okText(q){ return String(q.ok||q.c[q.a]).replace(/^\s*今日5分[：:で、,]\s*/, ""); }
function recapIcons(qs){
  const used = new Set(), order = ["shield","phone","key","card","sns","alert","pc","mail","update","backup","twofa","wifi","reuse","sms","money","job"];
  return qs.map(q=>{
    let k = (q.img&&ICONS[q.img]) ? q.img : guessIcon(q);
    if (used.has(k)) { const g = guessIcon({q: q.q+" "+(q.ok||"")+" "+(q.ng||"")+" "+(q.scene?q.scene.msg||"":"")}); k = !used.has(g) ? g : (order.find(x=>!used.has(x)) || k); }
    used.add(k); return k;
  });
}
function recapRow(q, k, wrong){
  return `<div class="rcrow"><span class="rcic"><svg viewBox="0 0 100 100">${ICONS[k]}</svg></span><span class="rctx">${esc(okText(q))}${wrong?`<em>要チェック</em>`:""}</span></div>`;
}
function recapBox(p){
  const qs = S.qs, ic = recapIcons(qs);
  const motto = `<div class="rcmotto">🐾 あやしいと思ったら、お金を払う前・入力する前に、<b>家族に相談</b></div>`;
  if (S.mode==="review"){
    const wr = qs.map((q,i)=>i).filter(i=>p[i]!==qs[i].a);
    if (!wr.length) return `<div class="recap rcclear">🎉 復習クリア！<small>ぜんぶ覚えていたワン</small></div>`;
    return `<div class="recap"><div class="rctitle">📝 もう一度チェック<small>まちがえた問題の「こうする」</small></div>${wr.map(i=>recapRow(qs[i],ic[i],false)).join("")}${motto}</div>`;
  }
  let ci = qs.findIndex(q=>q.rep); if (ci<0) ci = qs.findIndex(q=>q.set);
  const ch = ci>=0 ? `<div class="chal"><div class="chh">⏱ 今日の5分チャレンジ</div><div class="chb"><span class="rcic"><svg viewBox="0 0 100 100">${ICONS[ic[ci]]}</svg></span><span>${esc(okText(qs[ci]))}</span></div></div>` : "";
  const rows = qs.map((q,i)=>i===ci?"":recapRow(q,ic[i],p[i]!==q.a)).join("");
  return `${ch}<div class="recap"><div class="rctitle">📝 今日のおさらい<small>こうすればOK！</small></div>${rows}${motto}</div>`;
}
function showSummary(){
  const p = S.picks;
  const score = p.filter((x,i)=>x===S.qs[i].a).length;
  const total = S.qs.length;
  const msg = score===total ? "満点！すばらしいです 🎉" : score>=3 ? "いい調子です。解説もおさらいしておきましょう。" : "ここで知れたのが一番の収穫です。おさらいしてみましょう。";
  const title = S.mode==="review" ? `${S.key==="y"?"昨日":"1週間前"}の復習の結果` : `${S.day.day}日目の結果`;
  const nx = S.key ? nextStep(S.key) : null;
  $("app").innerHTML = `<div class="card">
    <div class="msg">${title}</div>
    ${reward(score,total)}
    <div class="score">${score} / ${total}</div>
    <div class="msg">${msg}</div>
    ${recapBox(p)}
    ${nx ? nextBox(nx) : (S.key ? `<div class="msg" style="margin-top:12px">今日のメニューはこれでおしまいです。おつかれさまでした ☕</div>` : "")}
    <details class="more rvmore"><summary><span class="qh">📚 問題ごとにふりかえる ▼</span></summary>
    <div class="review">${S.qs.map((q,i)=>`<div class="item">
      <div>${p[i]===q.a?"⭕":"❌"} <b>${q.label}</b>「${q.q}」</div>${q.scene?`<div class="qmsg">${q.scene.t==="call"?"📞":q.scene.t==="popup"?"⚠️":"💬"} ${esc(q.scene.msg)}</div>`:""}
      ${p[i]===q.a ? "" : `<div class="mine ngtxt">あなたの選んだ回答：${q.c[p[i]]}</div>${q.w&&q.w[p[i]]?`<div class="whysm">🤔 ${rich(q.w[p[i]])}</div>`:""}`}
      <div class="a">答え：${q.c[q.a]}</div>
      ${q.pts&&q.pts.length?`<ol class="pts">${q.pts.map((t,j)=>`<li><span class="pn">${j+1}</span><span>${rich(t)}</span></li>`).join("")}</ol>`:`<div class="exp">${rich(q.e)}</div>`}${tips(q)}${column(q)}</div>`).join("")}</div>
    </details>
    <button class="btn ghost" id="retry">もう一度ちょうせんする</button>
  </div>`;
  if (nx) $("goNext").onclick = () => nx.key==="t" ? startStep(nx) : reviewIntro(nx.key, () => startStep(nx));
  $("retry").onclick = () => {
    if (S.mode==="day"){ const d=S.day; delete results[d.day]; save(KEY, results); renderHist(); startDay(d); }
    else startReview(S.key);
  };
  say(score===total ? "満点だワン！えらい！🎉" : score>=3 ? "よくがんばったワン！" : "ドンマイ！ルナといっしょにおさらいしよう", score>=3?"happy":"normal");
  renderMenu();
}

function renderMenu(){
  const s = steps();
  if (s.length < 2){ $("menu").innerHTML = ""; return; }
  $("menu").innerHTML = `<div class="menu"><b>今日のメニュー</b>${s.map(x=>`
    <button class="mrow" data-k="${x.key}"><span>${x.done?"✅":"⬜"} ${x.title}<span class="s">（${fmt(x.day.date)}）</span></span><span class="s">${x.done?"できた！":"未"}</span></button>`).join("")}</div>`;
  document.querySelectorAll(".mrow").forEach(b => b.onclick = () => startStep(s.find(x=>x.key===b.dataset.k)));
}

let lastStamps = null;
function renderHist(){
  const asc = list.slice();
  const isOn = d => !!(getRes(d) || (d.day in doneEver));
  const cnt = asc.filter(isOn).length;
  const slots = Math.max(7, Math.ceil((asc.length+1)/7)*7);
  const prev = lastStamps; lastStamps = new Set(asc.filter(isOn).map(d=>d.day));
  let tiles = "";
  for (let i=0;i<slots;i++){
    const d = asc[i];
    const goal = (i+1)%7===0;
    if (!d){ tiles += `<span class="stile future ${goal?"goal":""}">${goal?"<span style='font-size:1.1rem'>🍖</span>":`<span class="dn">${i+1}</span>`}</span>`; continue; }
    const on = isOn(d), r = getRes(d);
    const sc = r ? `${r.picks.filter((x,k)=>x===d.qs[k].a).length}/5` : (on?"":"まだ");
    const fresh = on && prev && !prev.has(d.day);
    tiles += `<button class="stile ${on?"on":""} ${fresh?"new":""} ${d===todayDay?"today":""} ${goal&&!on?"goal":""}" data-d="${d.day}" aria-label="${d.day}日目 ${d.theme}">${on?`<span class="paw">${PAW}</span>`:""}<span class="dn">${d.day}</span><span class="sc">${sc}</span></button>`;
  }
  const left = 7 - (cnt % 7);
  $("hist").innerHTML = `<div class="stampcard"><div class="sctop"><span class="scf">${luna("happy")}</span><b>ルナのスタンプカード</b><span class="cnt">🐾 ${cnt}こ</span></div>
    <div class="sgrid">${tiles}</div>
    <div class="scnext">${cnt>0 && cnt%7===0 ? "🍖 7こたまった！ステーキゲットだワン！" : `あと${left}日で 🍖 ステーキのごほうび！`}</div>
    <div class="schint">スタンプをタップすると、その日の問題を見られるよ</div></div>`;
  document.querySelectorAll(".stile[data-d]").forEach(b => b.onclick = () => { startDay(list.find(d=>d.day===+b.dataset.d)); toLuna(); });
}
renderHist();
startDay(todayDay);

// 日付が変わったら、最新のページを読み直す（ホーム画面のアプリが昨日の画面のまま眠っているとき用）
function freshReload(){ try{ location.replace(location.pathname + "?d=" + todayJST()); }catch(e){ location.reload(); } }
function checkNewDay(){ if (todayJST() !== TODAY) freshReload(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
window.addEventListener("pageshow", checkNewDay);
window.addEventListener("focus", checkNewDay);
// 古いページが残っていて今日の問題がないときは、1回だけ最新を取りにいく
(function(){
  const newest = DAYS.reduce((m,d)=> d.date>m ? d.date : m, "");
  let q = ""; try{ q = new URLSearchParams(location.search).get("d") || ""; }catch(e){}
  if (newest < TODAY && q !== TODAY) freshReload();
})();
</script>
</body>
</html>
